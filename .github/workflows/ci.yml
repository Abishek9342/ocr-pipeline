name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # enables manually running the benchmark-regression job below on demand

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extras, no OCR engine binaries)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Validate install into a clean environment
        run: |
          python -m venv /tmp/clean-install-check
          /tmp/clean-install-check/bin/pip install dist/*.whl
          /tmp/clean-install-check/bin/python -c "from ocr_resilience import OCR; print('import OK')"
          /tmp/clean-install-check/bin/ocr-pipeline --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Manual-only (workflow_dispatch), not on every push/PR — the full 11-preset
  # x 5-engine benchmark takes minutes, and Tesseract/EasyOCR model downloads
  # add real setup time. Mission section 26's "tiered CI strategy for heavy
  # benchmarks" applied literally: this is the heavy tier, opt-in only.
  benchmark-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract binary + package with tesseract/easyocr/benchmark extras
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr
          pip install -e ".[tesseract,easyocr,benchmark]"
      - name: Run a fast benchmark subset
        run: |
          python -m benchmark.run_benchmark --engines tesseract,easyocr,ours \
            --presets clean,heavy_blur,skewed --out /tmp/ci_bench
      - name: Check for regression against the stored baseline
        run: |
          python scripts/check_regression.py \
            --current /tmp/ci_bench/benchmark.json \
            --baseline benchmark/results/baseline_summary.json \
            --max-cer-increase 0.03 --max-latency-increase-pct 40
        # Thresholds are looser than a full-preset baseline comparison would use,
        # since this subset (3 of 11 presets) is a different, noisier sample than
        # the baseline's full 11-preset run — not a strict apples-to-apples check,
        # a coarse "did something break badly" signal.
