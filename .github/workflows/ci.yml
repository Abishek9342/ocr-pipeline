name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extras, no OCR engine binaries)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Validate install into a clean environment
        run: |
          python -m venv /tmp/clean-install-check
          /tmp/clean-install-check/bin/pip install dist/*.whl
          /tmp/clean-install-check/bin/python -c "from ocr_resilience import OCR; print('import OK')"
          /tmp/clean-install-check/bin/ocr-pipeline --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
