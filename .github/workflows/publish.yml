name: Publish to PyPI

# Triggered by publishing a GitHub Release (tag the release vX.Y.Z to
# match pyproject.toml's `version`). Uses PyPI trusted publishing (OIDC) —
# no API token stored in this repo. Before the first release, register
# this project on pypi.org and add a trusted publisher pointing at
# this repo + workflow file + the `pypi` environment below.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
